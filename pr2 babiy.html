<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denemo — оформлення замовлення</title>

  <style>
    /* змінні */
    :root {
      --accent: #008080;
      --error: #cc0000;
      --bg: #eeeeee;
      --box: #ffffff;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: #333;
    }

    h1 {
      text-align: center;
      color: var(--accent);
    }

    h2 {
      color: var(--accent);
      font-size: 20px;
    }

    /* головний flex: форма і підсумок замовлення в рядок */
    .page {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .form-box {
      flex: 2;
      min-width: 300px;
      background-color: var(--box);
      padding: 20px;
      border-radius: 10px;
    }

    .side {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .side-box {
      background-color: var(--box);
      padding: 15px;
      border-radius: 10px;
    }

    /* поля: label зверху, input знизу */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 15px;
    }

    /* два поля в одному рядку */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .row .field {
      flex: 1;
      min-width: 130px;
    }

    label {
      font-weight: bold;
    }

    .hint {
      font-size: 13px;
      color: gray;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      padding: 8px;
      border: 2px solid #aaaaaa;
      border-radius: 5px;
      font-size: 16px;
    }

    /* стан фокусу */
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--accent);
      border-color: var(--accent);
    }

    /* стан помилки (коли щось вже введено) */
    input:invalid:not(:placeholder-shown) {
      border-color: var(--error);
    }

    /* радіо-кнопки доставки */
    fieldset {
      border: 2px solid #aaaaaa;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .radios {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .radios label {
      font-weight: normal;
    }

    /* рядок кнопок */
    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: var(--accent);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid orange;
    }

    .reset {
      background-color: gray;
    }

    /* медіа: товар */
    figure {
      margin: 0;
      text-align: center;
    }

    figure svg {
      width: 100%;
      max-width: 180px;
    }

    /* таблиця вартості */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #cccccc;
      padding: 5px;
      text-align: left;
    }

    thead {
      background-color: var(--accent);
      color: white;
    }

    tfoot {
      font-weight: bold;
    }

    /* вузькі екрани */
    @media (max-width: 600px) {
      .page {
        flex-direction: column;
      }
      .row {
        flex-direction: column;
        gap: 0;
      }
      .radios {
        flex-direction: column;
        gap: 5px;
      }
      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <h1>Оформлення замовлення</h1>

  <div class="page">

    <!-- ФОРМА -->
    <main class="form-box">
      <form action="#" method="post">

        <h2>Контактні дані</h2>

        <div class="row">
          <div class="field">
            <label for="first-name">Ім'я</label>
            <input type="text" id="first-name" name="first-name" placeholder="Іван"
                   required minlength="2">
          </div>
          <div class="field">
            <label for="last-name">Прізвище</label>
            <input type="text" id="last-name" name="last-name" placeholder="Петренко"
                   required minlength="2">
          </div>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="name@mail.com" required>
        </div>

        <div class="field">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" name="phone" placeholder="+380501234567"
                 required pattern="\+380[0-9]{9}" title="Формат: +380501234567">
          <span class="hint">Формат: +380 і дев'ять цифр</span>
        </div>

        <h2>Доставка</h2>

        <fieldset>
          <legend>Спосіб доставки</legend>
          <div class="radios">
            <div>
              <input type="radio" id="post" name="delivery" value="post" required>
              <label for="post">Нова пошта</label>
            </div>
            <div>
              <input type="radio" id="courier" name="delivery" value="courier">
              <label for="courier">Кур'єр</label>
            </div>
            <div>
              <input type="radio" id="email-key" name="delivery" value="email">
              <label for="email-key">На e-mail (ключ)</label>
            </div>
          </div>
        </fieldset>

        <div class="field">
          <label for="city">Місто</label>
          <select id="city" name="city" required>
            <option value="">Оберіть місто</option>
            <option value="if">Івано-Франківськ</option>
            <option value="lviv">Львів</option>
            <option value="kyiv">Київ</option>
          </select>
        </div>

        <h2>Оплата</h2>

        <div class="field">
          <label for="card">Номер картки</label>
          <input type="text" id="card" name="card" placeholder="1234 5678 9012 3456"
                 required pattern="[0-9]{4} [0-9]{4} [0-9]{4} [0-9]{4}"
                 title="Формат: 1234 5678 9012 3456">
        </div>

        <div class="row">
          <div class="field">
            <label for="date">Термін дії</label>
            <input type="text" id="date" name="date" placeholder="09/28"
                   required pattern="[0-9]{2}/[0-9]{2}" title="Формат: 09/28">
          </div>
          <div class="field">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="123"
                   required pattern="[0-9]{3}" title="Три цифри">
          </div>
        </div>

        <div class="buttons">
          <button type="submit">Оплатити</button>
          <button type="reset" class="reset">Очистити</button>
        </div>

      </form>
    </main>

    <!-- БОКОВА ЧАСТИНА -->
    <aside class="side">

      <div class="side-box">
        <figure>
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect x="5" y="5" width="90" height="90" rx="15" fill="#008080"></rect>
            <text x="50" y="68" font-size="55" text-anchor="middle" fill="white">D</text>
          </svg>
          <figcaption>Denemo Pro — річна підписка</figcaption>
        </figure>
      </div>

      <div class="side-box">
        <h2>Ваше замовлення</h2>
        <table>
          <thead>
            <tr>
              <th>Товар</th>
              <th>К-сть</th>
              <th>Ціна</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Denemo Pro</td>
              <td>1</td>
              <td>1200 грн</td>
            </tr>
            <tr>
              <td>Підтримка</td>
              <td>1</td>
              <td>300 грн</td>
            </tr>
            <tr>
              <td>Доставка</td>
              <td>1</td>
              <td>0 грн</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">Разом</td>
              <td>1500 грн</td>
            </tr>
          </tfoot>
        </table>
      </div>

    </aside>

  </div>

</body>
</html>
